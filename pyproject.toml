[project]
name = "cves-autotriager"
version = "0.1.0"
description = "Automated triage tooling for CVEs."
authors = [{ name = "Enrico Deusebio" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
	"envyaml>=1.10",
	"langchain[anthropic,openai,deepseek]>=1.1",
	"pandas>=2.0",
	"pyyaml>=6.0",
	"requests>=2.32",
	"github-copilot-sdk (>=1.0.13,<2.0.0)",
]

[project.scripts]
cves-autotriager = "cves_autotriager.cli:main"

[tool.poetry]
packages = [{ include = "cves_autotriager" }]
include = [
	{ path = "cves_autotriager/resources/*.txt", format = ["sdist", "wheel"] },
	{ path = "cves_autotriager/resources/*.yaml", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.11"
pandas-stubs = ">=2.0"
types-PyYAML = ">=6.0"
types-requests = ">=2.32"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["cves_autotriager/CVE_Analysis_1.11.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
exclude = ["cves_autotriager/CVE_Analysis_1\\.11\\.py"]

[[tool.mypy.overrides]]
module = ["envyaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=cves_autotriager --cov-report=term-missing"
